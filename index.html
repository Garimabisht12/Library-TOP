<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="header">
        <h1>Library App</h1>

    </div>

    <div class="content">

        <button command="show-modal" commandfor="my-dialog" class="addBtn">Add New Book</button>

        <dialog id="my-dialog">
            <h1>Enter Details</h1>
            <form action="" method="dialog">
                <label for="title">Title</label>
                <input type="text" name="title" autofocus>

                <label for="author">Author</label>
                <input type="text" name="author">

                <label for="pages">Pages</label>
                <input type="number" name="pages">

                <label for="status">Read
                    <input type="radio" name="status" value="true" id="status"> True
                    <input type="radio" name="status" value='' id="status" checked> False

                </label>
                <button>Add Book</button>
            </form>
            <button commandfor="my-dialog" command="close">Close</button>
        </dialog>



        <div class="grid" id="container">

        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
